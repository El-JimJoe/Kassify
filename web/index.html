<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050a0a" />
    <title>Kassify</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=21" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">K</span>
          <div>
            <h1>Kassify</h1>
            <p id="subtitle">Anmeldung</p>
          </div>
        </div>
        <div class="topbar-meta" id="top-actions"></div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <nav id="nav" class="nav" hidden></nav>
      <main id="view" class="view">
        <!-- Neutrale Startmaske: sie steht schon vor der ersten Antwort des Servers
             und darf deshalb weder Anmeldung noch Ersteinrichtung behaupten. -->
        <section class="gate">
          <h2>Kassify</h2>
          <form id="login-form" class="stack">
            <label class="field">
              Passwort
              <input id="password-input" name="password" type="password" autocomplete="current-password" />
            </label>
            <p class="hint">Beim allerersten Start wird hier das Admin-Passwort gesetzt, mindestens 8 Zeichen.</p>
            <p class="error" id="form-error" hidden></p>
            <button class="pay" type="submit">Weiter</button>
          </form>
        </section>
      </main>
    </div>
    <script src="./app.js?v=21"></script>
  </body>
</html>
