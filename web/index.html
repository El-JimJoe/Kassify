<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110f" />
    <title>Kassify</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">K</span>
          <div>
            <h1>Kassify</h1>
            <p id="subtitle">Gemeinschaftskasse</p>
          </div>
        </div>
        <div class="topbar-meta" id="top-actions"></div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <nav id="nav" class="nav" hidden></nav>
      <main id="view" class="view"></main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
